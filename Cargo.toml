[package]
name = "yft-sandbox-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1.0.104"
